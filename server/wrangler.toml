name = "kids-kalender-push"
main = "src/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "PUSH_SUBS"
id = "b5167e1abc18465d99faea9b28473d49"

[triggers]
# Covers 10:00 and 21:00 Europe/Berlin year-round: each wall-clock target has
# one UTC cron for CET (winter, UTC+1) and one for CEST (summer, UTC+2) —
# src/index.js's scheduled() gates on the actual Berlin hour, so only the
# entry matching the current season does anything.
crons = ["0 8 * * *", "0 9 * * *", "0 19 * * *", "0 20 * * *"]

[vars]
VAPID_SUBJECT = "https://derherrfeldmann.github.io"
VAPID_PUBLIC_KEY = "BKI3qQcYX0xsrDDw4mwhr3RLGGiXxVqFcgM1MPymBdqDMp9GDCmCKPDaCw_Zu1p6yxhac9velfmRn2ny421tmYo"
CLIENT_ORIGIN = "https://derherrfeldmann.github.io"
