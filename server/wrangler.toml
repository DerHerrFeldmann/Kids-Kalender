name = "kids-kalender-push"
main = "src/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "PUSH_SUBS"
id = "b5167e1abc18465d99faea9b28473d49"

[triggers]
# Fixed UTC times (23:00 and 11:00), not Berlin-local: lands exactly on
# 00:00/12:00 Berlin during CET (winter), drifts an hour to 01:00/13:00
# during CEST (summer). Only 2 crons instead of the DST-correct 4, to leave
# headroom under the Workers Free plan's 5-cron-per-account cap.
crons = ["0 23 * * *", "0 11 * * *"]

[vars]
VAPID_SUBJECT = "https://derherrfeldmann.github.io"
VAPID_PUBLIC_KEY = "BKI3qQcYX0xsrDDw4mwhr3RLGGiXxVqFcgM1MPymBdqDMp9GDCmCKPDaCw_Zu1p6yxhac9velfmRn2ny421tmYo"
CLIENT_ORIGIN = "https://derherrfeldmann.github.io"
